<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jardín Infantil Las Terrazas - Asistencia</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs UMD -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
      import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
      import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
      
      window.firebaseModules = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc };
      window.dispatchEvent(new Event('firebase-loaded'));
    </script>
  </head>
  <body class="bg-slate-100 font-sans antialiased text-slate-800">
    <div id="app" class="min-h-screen flex flex-col items-center justify-center bg-slate-900 text-white p-4">
      <div class="animate-pulse flex flex-col items-center space-y-4">
        <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/50">
          <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-white"></i>
        </div>
        <p class="text-sm font-black tracking-widest uppercase text-slate-400">Cargando Sistema Las Terrazas...</p>
      </div>
    </div>

    <script>
      const FUNCIONARIAS_WORD_EXACTO = [
        "JACQUELINE ARELLANO MAMANI", "SARAY BLACETT GUZMAN", "PAULA BORQUEZ BENITT",
        "JACQUELINE BURGOS GONZALEZ", "NATALIA CARTAGENA OCHOA", "JOSELYN CORREA MAMANI",
        "LIZETTE CRUZ BUTRON", "DOLLY FERNANDEZ MAMANI", "NICOLE FERRADA MARTINEZ",
        "ERIKA FRANCINO FUENTES", "AMERICA GAETE FARFÁN", "PATRICIA GAVIÑO SANCHEZ",
        "SOLANGE GONZALEZ ARANCIBIA", "JOHANA MANRIQUEZ JAIME", "CINDY MARQUEZ MUÑOZ",
        "MIREYA MOLINA RAMIREZ", "PATRICIA PARODI FERNANDEZ", "BARBARA PEREZ MONARDES",
        "IRIS RAMOS LAZARO", "FRANCHESCA ROCHA JULIO", "VERONICA ROJAS ZAVALA",
        "YESENIA SALINAS BALTAZAR", "NICOLE SANTELICES CRUZ", "ALICIA SANTIS ZUÑIGA",
        "GEORGINA TAPIA MUÑOZ", "EDGARDO VALDEBENITO ROMERO", "JAEL VARGAS FLORES",
        "KATHERINE VEGA MATAMOROS", "YINA VERA DIAZ", "NATALY ZAGAL FLORES",
        "LAURA ZERNA MAMANI", "ANITA BARRAZA BARRERA"
      ];

      const JORNADA_MINUTOS = 528;
      const HORA_INICIO_AM = "08:30";
      const HORA_INICIO_PM = "12:54";

      const timeToMins = (timeStr) => {
        if (!timeStr) return 0;
        const [h, m] = timeStr.split(':').map(Number);
        return (h * 60) + m;
      };

      const minsToTime = (mins) => {
        if (mins <= 0) return "00:00";
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      };

      const getDaysOfMonth = (year, month) => {
        const date = new Date(year, month - 1, 1);
        const days = [];
        while (date.getMonth() === month - 1) {
          const dayOfWeek = date.getDay();
          if (dayOfWeek !== 0 && dayOfWeek !== 6) {
            days.push(new Date(date).toISOString().split('T')[0]);
          }
          date.setDate(date.getDate() + 1);
        }
        return days;
      };

      let state = {
        loggedUser: null,
        users: [{ id: 'admin-default', username: 'admin', password: '123', role: 'admin' }],
        funcionarias: FUNCIONARIAS_WORD_EXACTO.map((nombre, idx) => ({ id: `func-${idx+1}`, nombre, orden: idx+1 })),
        registros: {},
        tareas: [],
        currentView: 'asistencia',
        sidebarOpen: true,
        fechaAsistencia: new Date().toISOString().split('T')[0],
        selectedFuncIdConsulta: '',
        mesConsulta: '2026-08',
        mesResumen: '2026-08'
      };

      window.addEventListener('firebase-loaded', async () => {
        const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore, collection, onSnapshot } = window.firebaseModules;
        
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
          apiKey: "AIzaSyC5QsKG_1cwQjPLM6Ug9p5nFvS2cCYmEB4",
          authDomain: "asistencia-jardin.firebaseapp.com",
          projectId: "asistencia-jardin",
          storageBucket: "asistencia-jardin.firebasestorage.app",
          messagingSenderId: "103153253927",
          appId: "1:103153253927:web:ba51f2b54898ff83d9d802"
        };

        try {
          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);
          const db = getFirestore(app);
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'jardin-app';

          await signInAnonymously(auth);

          // Subscriptions
          onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'app_users'), (snap) => {
            const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (data.length > 0) state.users = data;
            render();
          });

          onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'funcionarias'), (snap) => {
            const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (data.length > 0) {
              state.funcionarias = data.sort((a,b)=>(a.orden||0)-(b.orden||0));
            }
            if(!state.selectedFuncIdConsulta && state.funcionarias.length > 0) {
              state.selectedFuncIdConsulta = state.funcionarias[0].id;
            }
            render();
          });

          onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'registros'), (snap) => {
            const recs = {};
            snap.docs.forEach(d => { recs[d.id] = d.data(); });
            state.registros = recs;
            render();
          });

          onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'tareas'), (snap) => {
            state.tareas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
          });

        } catch (e) {
          console.error("Firebase init error:", e);
        }
        
        render();
      });

      // Fallback if firebase script takes too long
      setTimeout(() => {
        if(document.getElementById('app').innerHTML.includes('Cargando')) {
          render();
        }
      }, 1500);

      // Actions
      window.appActions = {
        login: (e) => {
          e.preventDefault();
          const u = e.target.username.value;
          const p = e.target.password.value;
          const found = state.users.find(usr => usr.username === u && usr.password === p);
          if (found) {
            state.loggedUser = found;
            render();
          } else {
            alert("Usuario o contraseña incorrectos.");
          }
        },
        logout: () => {
          state.loggedUser = null;
          render();
        },
        setView: (v) => {
          state.currentView = v;
          render();
        },
        toggleSidebar: () => {
          state.sidebarOpen = !state.sidebarOpen;
          render();
        },
        setFechaAsistencia: (val) => {
          state.fechaAsistencia = val;
          render();
        },
        updateRecord: async (funcId, updates) => {
          const { getFirestore, doc, setDoc } = window.firebaseModules || {};
          if (!getFirestore) return;
          const db = getFirestore();
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'jardin-app';
          const recordId = `${state.fechaAsistencia}_${funcId}`;
          const current = state.registros[recordId] || { fecha: state.fechaAsistencia, funcId, estado: null, atrasoMinutos: 0, horaLlegada: '', permisos: [], licencia: null };
          const updated = { ...current, ...updates };
          state.registros[recordId] = updated;
          render();
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'registros', recordId), updated);
        },
        marcarTodos: async (estado) => {
          if(!confirm(`¿Seguro que deseas marcar a todas las funcionarias como ${estado}?`)) return;
          for (let f of state.funcionarias) {
            const rec = state.registros[`${state.fechaAsistencia}_${f.id}`];
            let minCubiertos = 0;
            if (rec?.licencia?.tipo === 'Completa') minCubiertos += JORNADA_MINUTOS;
            rec?.permisos?.forEach(p => { if (['Feriado Legal', 'Administrativo Día Completo'].includes(p.tipo)) minCubiertos += JORNADA_MINUTOS; });
            if (minCubiertos < JORNADA_MINUTOS) {
              await window.appActions.updateRecord(f.id, { estado, atrasoMinutos: 0, horaLlegada: '' });
            }
          }
        },
        addPermiso: async (funcId, tipo, jornada, desde, hasta) => {
          const recordId = `${state.fechaAsistencia}_${funcId}`;
          const current = state.registros[recordId] || { fecha: state.fechaAsistencia, funcId, estado: null, atrasoMinutos: 0, horaLlegada: '', permisos: [], licencia: null };
          let permiso = { tipo };
          if (tipo === 'Administrativo Medio Día') permiso.jornada = jornada;
          if (tipo === 'Descanso Complementario') { permiso.desde = desde; permiso.hasta = hasta; }
          const nuevos = [...(current.permisos || []), permiso];
          await window.appActions.updateRecord(funcId, { permisos: nuevos });
        },
        removePermiso: async (funcId, index) => {
          const recordId = `${state.fechaAsistencia}_${funcId}`;
          const current = state.registros[recordId];
          if(!current) return;
          const nuevos = current.permisos.filter((_, idx) => idx !== index);
          await window.appActions.updateRecord(funcId, { permisos: nuevos });
        },
        setLicencia: async (funcId, licenciaObj) => {
          await window.appActions.updateRecord(funcId, { licencia: licenciaObj });
        },
        addTarea: async (e) => {
          e.preventDefault();
          const txt = e.target.nueva.value.trim();
          if(!txt) return;
          const { getFirestore, doc, setDoc } = window.firebaseModules || {};
          if(!getFirestore) return;
          const db = getFirestore();
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'jardin-app';
          const id = Date.now().toString();
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tareas', id), { txt, done: false });
          e.target.reset();
        },
        toggleTarea: async (id, done) => {
          const { getFirestore, doc, setDoc } = window.firebaseModules || {};
          if(!getFirestore) return;
          const db = getFirestore();
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'jardin-app';
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tareas', id), { done: !done }, { merge: true });
        },
        delTarea: async (id) => {
          const { getFirestore, doc, deleteDoc } = window.firebaseModules || {};
          if(!getFirestore) return;
          const db = getFirestore();
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'jardin-app';
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tareas', id));
        },
        addFuncionaria: async (e) => {
          e.preventDefault();
          const nombre = e.target.nombre.value.trim();
          if(!nombre) return;
          const { getFirestore, doc, setDoc } = window.firebaseModules || {};
          if(!getFirestore) return;
          const db = getFirestore();
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'jardin-app';
          const id = Date.now().toString();
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'funcionarias', id), { nombre, orden: state.funcionarias.length + 1 });
          e.target.reset();
        },
        delFuncionaria: async (id) => {
          if(!confirm("¿Eliminar funcionaria?")) return;
          const { getFirestore, doc, deleteDoc } = window.firebaseModules || {};
          if(!getFirestore) return;
          const db = getFirestore();
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'jardin-app';
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'funcionarias', id));
        }
      };

      // Main Render Function
      function render() {
        const root = document.getElementById('app');
        
        if (!state.loggedUser) {
          root.innerHTML = `
            <div class="min-h-screen w-full bg-gradient-to-br from-indigo-50 via-slate-50 to-blue-100 flex items-center justify-center p-4 font-sans">
              <form onsubmit="window.appActions.login(event)" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-slate-100 backdrop-blur-sm">
                <div class="flex justify-center mb-6 text-indigo-600 bg-indigo-50 w-16 h-16 rounded-2xl items-center mx-auto shadow-inner"><i data-lucide="users" class="w-8 h-8"></i></div>
                <h1 class="text-2xl font-black text-center text-slate-800 mb-1">Acceso al Sistema</h1>
                <p class="text-center text-slate-400 mb-6 text-xs uppercase font-bold tracking-wider">Jardín Infantil Las Terrazas</p>
                <div class="space-y-4">
                  <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Usuario</label><input name="username" type="text" required class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 font-medium bg-slate-50/50" /></div>
                  <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Contraseña</label><input name="password" type="password" required class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 font-medium bg-slate-50/50" /></div>
                  <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">Ingresar</button>
                </div>
              </form>
            </div>
          `;
          if(window.lucide) window.lucide.createIcons();
          return;
        }

        const sidebarWidth = state.sidebarOpen ? 'w-64' : 'w-20';
        const mainMargin = state.sidebarOpen ? 'ml-64' : 'ml-20';

        root.innerHTML = `
          <div class="min-h-screen flex bg-slate-100 font-sans text-slate-800 w-full">
            <aside class="print:hidden bg-slate-900 text-slate-300 transition-all duration-300 ${sidebarWidth} flex flex-col fixed h-full z-20 shadow-2xl">
              <div class="p-4 flex items-center justify-between border-b border-slate-800 bg-slate-950">
                ${state.sidebarOpen ? '<span class="font-extrabold text-sm text-white tracking-wide uppercase">Panel de Control</span>' : ''}
                <button onclick="window.appActions.toggleSidebar()" class="p-2 hover:bg-slate-800 text-white rounded-xl transition"><i data-lucide="menu" class="w-5 h-5"></i></button>
              </div>
              <div class="p-4 border-b border-slate-800 bg-slate-900/50">
                ${state.sidebarOpen ? `
                  <div><p class="text-[10px] text-slate-500 uppercase font-extrabold tracking-wider">Usuario Conectado</p>
                  <p class="font-bold text-white truncate text-sm mt-0.5">${state.loggedUser.username} <span class="text-[10px] bg-indigo-600 px-2 py-0.5 rounded-md ml-1 text-white uppercase font-bold">${state.loggedUser.role}</span></p></div>
                ` : '<i data-lucide="users" class="w-6 h-6 mx-auto text-indigo-400"></i>'}
              </div>
              <nav class="flex-1 py-4 space-y-1.5 overflow-y-auto px-2">
                ${navItem('calendar-days', 'Asistencia Diaria', 'asistencia')}
                ${navItem('file-spreadsheet', 'Reporte Mensual', 'resumen')}
                ${navItem('clock', 'Consulta de Atrasos', 'consulta_atrasos')}
                ${navItem('shield-alert', 'Permisos y L/M', 'permisos')}
                ${navItem('check-square', 'Mis Tareas', 'tareas')}
                ${navItem('users', 'Personal / Func.', 'funcionarias')}
                ${state.loggedUser.role === 'admin' ? navItem('settings', 'Perfiles y Accesos', 'usuarios') : ''}
              </nav>
              <div class="p-4 border-t border-slate-800 bg-slate-950/50">
                <button onclick="window.appActions.logout()" class="flex items-center space-x-3 text-red-400 hover:text-red-300 w-full p-2.5 rounded-xl hover:bg-slate-800/80 transition text-sm font-bold"><i data-lucide="log-out" class="w-5 h-5"></i>${state.sidebarOpen ? '<span>Cerrar Sesión</span>' : ''}</button>
              </div>
            </aside>

            <main class="flex-1 transition-all duration-300 ${mainMargin} print:ml-0 print:w-full p-8 print:p-0">
              ${renderView()}
            </main>
          </div>
        `;

        if(window.lucide) window.lucide.createIcons();
      }

      function navItem(icon, label, view) {
        const active = state.currentView === view;
        return `
          <button onclick="window.appActions.setView('${view}')" class="w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl transition text-sm font-semibold ${active ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'} ${!state.sidebarOpen ? 'justify-center' : ''}" title="${!state.sidebarOpen ? label : ''}">
            <span class="${active ? 'text-white' : 'text-slate-400'}"><i data-lucide="${icon}" class="w-5 h-5"></i></span>
            ${state.sidebarOpen ? `<span class="truncate">${label}</span>` : ''}
          </button>
        `;
      }

      function renderView() {
        if (state.currentView === 'asistencia') {
          return `
            <div class="space-y-6 max-w-5xl mx-auto">
              <div class="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
                <div>
                  <h2 class="text-2xl font-black text-slate-800">Registro Diario de Asistencia</h2>
                  <p class="text-sm text-slate-500 mt-0.5">Control diario de presencia, ausencias y atrasos.</p>
                </div>
                <input type="date" value="${state.fechaAsistencia}" onchange="window.appActions.setFechaAsistencia(this.value)" class="mt-4 md:mt-0 border-2 border-slate-200 p-2.5 rounded-xl text-slate-700 outline-none focus:border-indigo-500 font-bold bg-slate-50" />
              </div>
              <div class="flex space-x-3 bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80">
                <button onclick="window.appActions.marcarTodos('Presente')" class="flex items-center px-4 py-2.5 bg-emerald-50 text-emerald-700 rounded-xl hover:bg-emerald-100 font-bold text-sm transition border border-emerald-200/60"><i data-lucide="check-check" class="w-4 h-4 mr-2"></i> Marcar Todos Presentes</button>
                <button onclick="window.appActions.marcarTodos('Ausente')" class="flex items-center px-4 py-2.5 bg-rose-50 text-rose-700 rounded-xl hover:bg-rose-100 font-bold text-sm transition border border-rose-200/60"><i data-lucide="x-circle" class="w-4 h-4 mr-2"></i> Marcar Todos Ausentes</button>
              </div>
              <div class="space-y-4">
                ${state.funcionarias.map(f => renderTarjetaFuncionaria(f)).join('')}
              </div>
            </div>
          `;
        }

        if (state.currentView === 'resumen') {
          const year = parseInt(state.mesResumen.split('-')[0]);
          const month = parseInt(state.mesResumen.split('-')[1]);
          const daysOfMonth = getDaysOfMonth(year, month);
          const nombreMesAnio = new Date(year, month - 1, 1).toLocaleString('es-ES', { month: 'long', year: 'numeric' }).toUpperCase();
          const grupo1 = state.funcionarias.slice(0, 16);
          const grupo2 = state.funcionarias.slice(16, 32);

          return `
            <div class="space-y-6 max-w-7xl mx-auto">
              <div class="print:hidden flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
                <div>
                  <h2 class="text-2xl font-black text-slate-800">Reporte Mensual Oficial</h2>
                  <p class="text-sm text-slate-500 mt-0.5">Diseño oficial idéntico al documento institucional.</p>
                </div>
                <div class="flex items-center space-x-3">
                  <input type="month" value="${state.mesResumen}" onchange="state.mesResumen=this.value; render()" class="border-2 border-slate-200 p-2.5 rounded-xl text-slate-700 outline-none font-bold bg-slate-50" />
                  <button onclick="window.print()" class="bg-slate-800 text-white p-3 rounded-xl hover:bg-slate-700 flex items-center shadow-md transition" title="Imprimir / PDF"><i data-lucide="printer" class="w-5 h-5"></i></button>
                </div>
              </div>

              <div id="report-document" class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200/80 print:shadow-none print:border-none print:p-0">
                ${renderTablaResumen(grupo1, 1, daysOfMonth, nombreMesAnio)}
                ${grupo2.length > 0 ? renderTablaResumen(grupo2, 17, daysOfMonth, nombreMesAnio) : ''}
              </div>
            </div>
          `;
        }

        if (state.currentView === 'tareas') {
          return `
            <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm p-8 border border-slate-200/80">
              <h2 class="text-2xl font-black text-slate-800 mb-1">Mis Tareas y Pendientes</h2>
              <p class="text-sm text-slate-500 mb-6">Organiza tus trabajos y pendientes diarios.</p>
              <form onsubmit="window.appActions.addTarea(event)" class="flex space-x-3 mb-6">
                <input type="text" name="nueva" placeholder="Nuevo trabajo o pendiente..." class="flex-1 border border-slate-200 p-3.5 rounded-xl outline-none font-bold text-sm bg-slate-50/50" />
                <button type="submit" class="bg-indigo-600 text-white px-6 rounded-xl font-black text-sm shadow-md shadow-indigo-200 hover:bg-indigo-700 transition">Agregar</button>
              </form>
              <div class="space-y-3">
                ${state.tareas.map(t => `
                  <div class="flex items-center justify-between p-4 border rounded-2xl transition ${t.done ? 'bg-slate-50 border-slate-200/60' : 'bg-white border-slate-200 shadow-sm'}">
                    <label class="flex items-center space-x-4 cursor-pointer flex-1">
                      <input type="checkbox" ${t.done ? 'checked' : ''} onchange="window.appActions.toggleTarea('${t.id}', ${t.done})" class="w-5 h-5 text-indigo-600 rounded-lg accent-indigo-600" />
                      <span class="text-base font-bold ${t.done ? 'line-through text-slate-400' : 'text-slate-800'}">${t.txt}</span>
                    </label>
                    <button onclick="window.appActions.delTarea('${t.id}')" class="p-2 text-rose-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        if (state.currentView === 'funcionarias') {
          return `
            <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm p-8 border border-slate-200/80">
              <h2 class="text-2xl font-black text-slate-800 mb-1">Gestión de Personal</h2>
              <p class="text-sm text-slate-500 mb-6">Agrega o elimina funcionarias del jardín.</p>
              <form onsubmit="window.appActions.addFuncionaria(event)" class="flex space-x-3 mb-6 bg-slate-50 p-4 rounded-2xl border border-slate-200/60">
                <input type="text" name="nombre" placeholder="Nombre completo..." class="flex-1 border border-slate-200 p-3 rounded-xl outline-none font-bold bg-white" />
                <button type="submit" class="bg-slate-900 text-white px-6 py-3 rounded-xl font-black flex items-center hover:bg-slate-800 transition"><i data-lucide="user-plus" class="w-4 h-4 mr-2"></i> Agregar</button>
              </form>
              <ul class="divide-y divide-slate-100 border border-slate-200/80 rounded-2xl overflow-hidden bg-white">
                ${state.funcionarias.map(f => `
                  <li class="p-4 flex justify-between items-center hover:bg-slate-50/80 transition-colors">
                    <span class="font-black text-slate-700 text-sm">${f.nombre}</span>
                    <button onclick="window.appActions.delFuncionaria('${f.id}')" class="p-2 bg-rose-50 text-rose-600 rounded-xl hover:bg-rose-100 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                  </li>
                `).join('')}
              </ul>
            </div>
          `;
        }

        return `<div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-sm">Vista en desarrollo</div>`;
      }

      function renderTarjetaFuncionaria(f) {
        const recordId = `${state.fechaAsistencia}_${f.id}`;
        const record = state.registros[recordId] || { estado: null, atrasoMinutos: 0, horaLlegada: '', permisos: [], licencia: null };

        let minCubiertos = 0;
        let tieneFeriado = false;
        let esperaAm = false;

        if (record.licencia?.tipo === 'Completa') minCubiertos += JORNADA_MINUTOS;
        if (record.licencia?.tipo === 'Media') {
          minCubiertos += (JORNADA_MINUTOS / 2);
          if (record.licencia?.jornada === 'AM') esperaAm = true;
        }

        record.permisos.forEach(p => {
          if (p.tipo === 'Feriado Legal') { minCubiertos += JORNADA_MINUTOS; tieneFeriado = true; }
          if (p.tipo === 'Administrativo Día Completo') minCubiertos += JORNADA_MINUTOS;
          if (p.tipo === 'Administrativo Medio Día') {
            minCubiertos += (JORNADA_MINUTOS / 2);
            if (p.jornada === 'AM') esperaAm = true;
          }
          if (p.tipo === 'Descanso Complementario') { minCubiertos += (timeToMins(p.hasta) - timeToMins(p.desde)); }
        });

        const requiereAsistencia = minCubiertos < JORNADA_MINUTOS && !tieneFeriado;

        return `
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 hover:border-indigo-200 transition-all">
            <div class="flex justify-between items-center mb-4">
              <h3 class="font-extrabold text-base text-slate-800">${f.nombre}</h3>
              <div class="space-x-2">
                <button onclick="const tipo=prompt('Tipo de Permiso (Feriado Legal, Administrativo Día Completo, Descanso Complementario):'); if(tipo) window.appActions.addPermiso('${f.id}', tipo)" class="px-3 py-1.5 bg-indigo-50 text-indigo-700 rounded-xl text-xs font-black hover:bg-indigo-100 transition border border-indigo-200/60">+ Permiso</button>
                <button onclick="const lm=prompt('Tipo de Licencia (Completa o Media):'); if(lm) window.appActions.setLicencia('${f.id}', {tipo: lm})" class="px-3 py-1.5 bg-rose-50 text-rose-700 rounded-xl text-xs font-black hover:bg-rose-100 transition border border-rose-200/60">+ L. Médica</button>
              </div>
            </div>

            ${(record.permisos.length > 0 || record.licencia) ? `
              <div class="mb-4 flex flex-wrap gap-2">
                ${record.licencia ? `
                  <span class="inline-flex items-center px-3 py-1 rounded-xl text-xs font-black bg-rose-50 text-rose-700 border border-rose-200">
                    L/M ${record.licencia.tipo}
                    <button onclick="window.appActions.setLicencia('${f.id}', null)" class="ml-2 text-rose-400 hover:text-rose-700">✕</button>
                  </span>
                ` : ''}
                ${record.permisos.map((p, i) => `
                  <span class="inline-flex items-center px-3 py-1 rounded-xl text-xs font-black bg-indigo-50 text-indigo-700 border border-indigo-200">
                    ${p.tipo}
                    <button onclick="window.appActions.removePermiso('${f.id}', ${i})" class="ml-2 text-indigo-400 hover:text-indigo-700">✕</button>
                  </span>
                `).join('')}
              </div>
            ` : ''}

            ${requiereAsistencia ? `
              <div class="p-4 bg-slate-50/80 rounded-xl border border-slate-200/60">
                <div class="flex space-x-6">
                  <label class="flex items-center space-x-2 cursor-pointer"><input type="radio" name="est_${f.id}" ${record.estado === 'Presente' ? 'checked' : ''} onchange="window.appActions.updateRecord('${f.id}', {estado: 'Presente', atrasoMinutos: 0, horaLlegada: ''})" class="w-4 h-4 text-indigo-600" /><span class="text-slate-700 font-bold text-sm">Presente</span></label>
                  <label class="flex items-center space-x-2 cursor-pointer"><input type="radio" name="est_${f.id}" ${record.estado === 'Ausente' ? 'checked' : ''} onchange="window.appActions.updateRecord('${f.id}', {estado: 'Ausente', atrasoMinutos: 0, horaLlegada: ''})" class="w-4 h-4 text-rose-600" /><span class="text-slate-700 font-bold text-sm">Ausente</span></label>
                  <label class="flex items-center space-x-2 cursor-pointer"><input type="radio" name="est_${f.id}" ${record.estado === 'Atraso' ? 'checked' : ''} onchange="window.appActions.updateRecord('${f.id}', {estado: 'Atraso'})" class="w-4 h-4 text-amber-500" /><span class="text-slate-700 font-bold text-sm">Atraso</span></label>
                </div>
                ${record.estado === 'Atraso' ? `
                  <div class="mt-4 flex items-center space-x-4 bg-amber-50/80 p-3.5 rounded-xl border border-amber-200">
                    <div><label class="text-xs text-amber-800 font-black block mb-1">Hora Llegada</label><input type="time" value="${record.horaLlegada || ''}" onchange="const h=this.value; const base=timeToMins(HORA_INICIO_AM); const llegada=timeToMins(h); const atr=Math.max(0, llegada - base); window.appActions.updateRecord('${f.id}', {horaLlegada: h, atrasoMinutos: atr})" class="p-2 border border-amber-300 rounded-lg font-mono bg-white font-bold" /></div>
                    <div class="pl-4 border-l border-amber-200"><label class="text-xs text-amber-800 font-black block mb-1">Minutos Atraso</label><span class="text-lg font-black text-amber-700">${record.atrasoMinutos || 0} minutos</span></div>
                  </div>
                ` : ''}
              </div>
            ` : `
              <div class="flex items-center text-sm text-emerald-700 font-bold p-3.5 bg-emerald-50 rounded-xl border border-emerald-200/80">Jornada cubierta en su totalidad.</div>
            `}
          </div>
        `;
      }

      function renderTablaResumen(lista, inicioNum, daysOfMonth, nombreMesAnio) {
        return `
          <div class="mb-6">
            <div class="text-center font-black text-sm mb-3 uppercase tracking-wide">
              REGISTRO DE ASISTENCIA Y CONTROL - ${nombreMesAnio}
            </div>
            <table class="w-full border-collapse text-[10px] print:text-[8px] bg-white font-mono shadow-sm">
              <thead>
                <tr class="bg-slate-100 print:bg-white font-black text-slate-800">
                  <th class="border border-black p-1 w-8 text-center">Nº</th>
                  <th class="border border-black p-1 text-left w-56 font-sans">NOMBRE FUNCIONARIO</th>
                  ${daysOfMonth.map(d => `<th class="border border-black p-1 w-7 text-center">${d.slice(8, 10)}</th>`).join('')}
                  <th class="border border-black p-1 text-center w-24 font-sans">TOTAL</th>
                </tr>
              </thead>
              <tbody>
                ${lista.map((f, idx) => {
                  let totalAtrasosMins = 0;
                  let totalLicenciaMedicaDias = 0;
                  let contadoresPermisos = { FL: 0, PA: 0 };
                  const numeroReal = inicioNum + idx;

                  daysOfMonth.forEach(d => {
                    const rec = state.registros[`${d}_${f.id}`];
                    if (rec) {
                      if (rec.licencia?.tipo === 'Completa') totalLicenciaMedicaDias += 1;
                      rec.permisos?.forEach(p => {
                        if (p.tipo === 'Feriado Legal') contadoresPermisos.FL++;
                        if (p.tipo === 'Administrativo Día Completo') contadoresPermisos.PA++;
                      });
                      if (rec.estado === 'Atraso') totalAtrasosMins += rec.atrasoMinutos || 0;
                    }
                  });

                  return `
                    <tr class="hover:bg-slate-50">
                      <td class="border border-black p-1 text-center font-bold">${numeroReal}</td>
                      <td class="border border-black p-1 font-bold pl-2 uppercase font-sans text-xs">${f.nombre}</td>
                      ${daysOfMonth.map(d => {
                        const rec = state.registros[`${d}_${f.id}`];
                        let celdaStr = "";
                        if (rec) {
                          if (rec.licencia?.tipo === 'Completa') celdaStr = "L/M";
                          rec.permisos?.forEach(p => {
                            if (p.tipo === 'Feriado Legal') celdaStr = "F/L";
                            if (p.tipo === 'Administrativo Día Completo') celdaStr = "P/A";
                          });
                          if (!celdaStr) {
                            if (rec.estado === 'Presente') celdaStr = ".";
                            else if (rec.estado === 'Ausente') celdaStr = "/";
                            else if (rec.estado === 'Atraso') celdaStr = "'";
                          }
                        }
                        return `<td class="border border-black p-1 text-center font-bold">${celdaStr}</td>`;
                      }).join('')}
                      <td class="border border-black p-1 text-center font-bold text-[8px] font-sans leading-tight">
                        ${totalLicenciaMedicaDias > 0 ? `<span class="text-red-700 block">L/M: ${totalLicenciaMedicaDias}d</span>` : ''}
                        ${totalAtrasosMins > 0 ? `<span class="text-orange-700 block">Atr: ${minsToTime(totalAtrasosMins)}</span>` : ''}
                        ${totalLicenciaMedicaDias === 0 && totalAtrasosMins === 0 ? '<span class="text-slate-400">-</span>' : ''}
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }
    </script>
  </body>
</html>
